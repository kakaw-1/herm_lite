name: build-docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/kakaw-1/herm-lite

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # v0.23.0 升级：这次构建只出 v0.23.0 和 sha-<commit>，
          # 不打 latest —— 验证通过后再手动把 latest 指过来。
          # 这样 GHCR 上的 latest 仍停留在 353d055（v2026.8.3），
          # 魔塔那边换 tag 即可一键回滚。
          tags: |
            type=sha
            type=raw,value=v0.23.0
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
